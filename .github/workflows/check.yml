name: Check for class suspensions

on:
  schedule:
    # GitHub runs schedules in UTC; the Philippines is UTC+8. Minutes are offset from :00/:30,
    # when GitHub's scheduler is busiest and runs start late.
    - cron: "7,37 8-22 * * *"   # every 30 min, 4:07 PM – 6:37 AM PH (when announcements come out)
    - cron: "7 23,0-7 * * *"    # hourly, 7:07 AM – 3:07 PM PH
  workflow_dispatch: {}         # "Run workflow" button, for a check right now

concurrency:
  group: live-check             # never two checks at once: each one builds on the last one's state
  cancel-in-progress: false

permissions:
  contents: write               # to save live/ back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Not set up yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Add the ANTHROPIC_API_KEY repository secret to start checking the news."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_KEY == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: env.HAS_KEY == 'true'
        run: pip install -r requirements.txt
      - name: Check the news
        if: env.HAS_KEY == 'true'
        run: python live.py run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save the results
        if: env.HAS_KEY == 'true'
        run: |
          git config user.name "walang-pasok-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Live check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
      # The repo is private, so the site can't read live/ from here: publish it with the page instead
      - name: Update the site
        if: env.HAS_KEY == 'true' && env.HAS_VERCEL == 'true'
        working-directory: trial_dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_1Ox40oesZMep2o6pkth2KJw2
          VERCEL_PROJECT_ID: prj_FQNAnyeEwbHUrp0eFNvR668jsp3q
        run: |
          cp ../live/data.json data.json
          npx --yes vercel@65.0.0 deploy --prod --yes --token "$VERCEL_TOKEN" > /dev/null
          echo "Site updated"
